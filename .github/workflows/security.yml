name: Security scans

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 1 * * 1' # Monday 09:23 Asia/Kuala_Lumpur
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    name: Python code and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned audit tools
        run: |
          python -m pip install -r tools/security-requirements.txt
          mkdir -p dist/security
      - name: Scan Python code
        id: code
        continue-on-error: true # Preserve reports and run other scans; final gate fails.
        run: bandit -r addons tools -f json -o dist/security/bandit.json
      - name: Audit Python runtime inventory
        id: runtime
        continue-on-error: true
        run: pip-audit -r requirements.txt --no-deps --disable-pip -f json -o dist/security/runtime.json
      - name: Audit development tools and transitive dependencies
        id: tooling
        continue-on-error: true
        run: pip-audit -r tools/security-requirements.txt --no-deps --disable-pip -f json -o dist/security/tooling.json
      - name: Summarize scans
        if: always()
        env:
          CODE_OUTCOME: ${{ steps.code.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          TOOLING_OUTCOME: ${{ steps.tooling.outcome }}
        run: python tools/security_summary.py
      - name: Upload reports for manual triage
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: security-reports
          path: dist/security/
          retention-days: 7
          if-no-files-found: warn
      - name: Require successful scans
        if: always()
        env:
          CODE_OUTCOME: ${{ steps.code.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          TOOLING_OUTCOME: ${{ steps.tooling.outcome }}
        run: |
          test "$CODE_OUTCOME" = success
          test "$RUNTIME_OUTCOME" = success
          test "$TOOLING_OUTCOME" = success

  actions:
    name: External Action pins and updates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install -r tools/security-requirements.txt
      - name: Test Action pin guard
        run: python -m unittest discover -s tests -p test_action_audit.py -v
      - name: Check local pins
        run: python tools/action_audit.py
      - name: Inspect nested pins and available releases
        # Do not expose an authenticated API token to pull-request code.
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/action_audit.py --online
      - name: Save Action audit
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: action-audit
          path: dist/action-audit/
          retention-days: 7
          if-no-files-found: warn
