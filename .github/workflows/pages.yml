name: Publish preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    environment: Development
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate declared dependency inventories
        run: python tools/check_dependencies.py
      - name: Install audit dependencies
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r tools/security-requirements.txt -r tools/build-requirements.txt -r tools/quality-requirements.txt
      - name: Validate external Action pins
        run: python3 tools/action_audit.py
      - name: Check Python correctness
        run: python3 tools/check_quality.py
      - name: Protect published release history
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT_NAME" in
            push) base="$PUSH_BEFORE" ;;
            workflow_dispatch) base="$(git rev-parse HEAD^)" ;;
            *) exit 1 ;;
          esac
          python3 tools/release_history.py releases/inventory.json --base-ref "$base"
      - name: Test preview
        run: python3 tools/run_tests.py --summary dist/tests/summary.json
      - name: Summarize automated tests
        if: always()
        run: |
          if [ -f dist/tests/summary.json ]; then
            {
              echo '### Automated test results'
              echo 'Aggregate counts only; skipped tests are not passes. No device or live-service acceptance is implied.'
              echo '```json'
              cat dist/tests/summary.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Automated test summary unavailable; inspect the failed or skipped setup/test step.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save aggregate test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: publication-test-results
          path: dist/tests/summary.json
          retention-days: 7
          if-no-files-found: warn
      - name: Build download site with separate Development test ZIP
        env:
          HOMEFX_TRAKT_ENVIRONMENT: Development
          TRAKT_CLIENT_ID: ${{ vars.TRAKT_CLIENT_ID }}
          TRAKT_REDIRECT_URI: ${{ vars.TRAKT_REDIRECT_URI }}
        run: python3 tools/build_site.py --development
      - name: Verify embedded preview repository
        run: python3 tools/verify_repository.py dist/site/repository --channel preview
      - name: Check reproducible release output
        env:
          HOMEFX_TRAKT_ENVIRONMENT: Development
          TRAKT_CLIENT_ID: ${{ vars.TRAKT_CLIENT_ID }}
          TRAKT_REDIRECT_URI: ${{ vars.TRAKT_REDIRECT_URI }}
        run: python3 tools/check_reproducibility.py --development
      - name: Archive Pages content
        run: tar -cf "$RUNNER_TEMP/artifact.tar" -C dist/site .
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Require the current main revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          current_sha="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          test -n "$current_sha"
          if [ "$current_sha" != "$EXPECTED_SHA" ]; then
            echo "Deployment refused: this run is no longer the current main revision."
            exit 1
          fi
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify-published:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate declared dependency inventories
        run: python tools/check_dependencies.py
      - name: Install verification dependency
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/build-requirements.txt
      - name: Download this run's deployed artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: gh run download "$GH_RUN_ID" --repo "$GH_REPO" --name github-pages --dir "$RUNNER_TEMP/published-artifact"
      - name: Stage bounded and verified site artifact
        # Validate members and repository contents before writing a fresh site tree.
        run: python tools/unpack_site.py "$RUNNER_TEMP/published-artifact/artifact.tar" "$RUNNER_TEMP/published-site"
      - name: Check deployed bytes against the uploaded artifact
        run: python tools/check_published.py "$RUNNER_TEMP/published-site"
